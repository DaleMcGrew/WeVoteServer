name: ruff

on:
  pull_request:
    branches: ["**"]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github"

      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
